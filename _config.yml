# Personal site settings. Add a public email only when ready.
locale: en-US
site_theme: default
title: Dokyeong Kang
title_separator: '|'
name: Dokyeong Kang
description: Ph.D. student at Sejong University. Research interests in CKKS, fully
  homomorphic encryption, and privacy-preserving machine learning.
url: https://hidogyeong.github.io
baseurl: ''
repository: Hidogyeong/Hidogyeong.github.io
author:
  name: Dokyeong Kang
  avatar: initials.svg
  bio: Ph.D. Student
  location: South Korea
  employer: Sejong University
  googlescholar: https://scholar.google.com/citations?user=8SUaCMkAAAAJ&hl=en
  github: Hidogyeong
breadcrumbs: false
words_per_minute: 160
future: false
read_more: disabled
talkmap_link: false
comments:
  provider: null
analytics:
  provider: false
atom_feed:
  hide: true
include:
- _pages
- files
exclude:
- README.md
- AGENTS.md
- SETUP_KO.md
- MAINTENANCE.md
- SOURCE_NOTES.md
- Gemfile
- Gemfile.lock
- LICENSE
- .github
- node_modules
- vendor
- _site
- assets/js/_main.js
- assets/js/plugins
- assets/js/vendor
encoding: utf-8
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
defaults:
- scope:
    path: ''
    type: pages
  values:
    layout: archive
    author_profile: true
sass:
  sass_dir: _sass
  style: compressed
timezone: Asia/Seoul
plugins:
- jekyll-feed
- jekyll-sitemap
- jekyll-redirect-from
whitelist:
- jekyll-feed
- jekyll-sitemap
- jekyll-redirect-from
compress_html:
  clippings: all
  ignore:
    envs: development
