name: Jekyll build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jekyll-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Build site
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production
      - name: Check generated pages
        run: |
          test -s _site/index.html
          test -s _site/cv/index.html
          test -s _site/publications/index.html
          test -s _site/assets/css/main.css
          test -s _site/assets/css/fontawesome.css
          test -s _site/files/radar-imu-hgr.bib
